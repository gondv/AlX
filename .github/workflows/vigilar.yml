name: Vigilar Parking Alfonso X

on:
  schedule:
    - cron: '*/5 * * * *' # Se lanza cada 5 minutos las 24h
  workflow_dispatch:
    inputs:
      modo_prueba:
        description: '¿Enviar mensaje de prueba a Telegram aunque esté agotado?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerías
        run: pip install requests beautifulsoup4

      - name: Ejecutar comprobación
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODO_PRUEBA: ${{ github.event.inputs.modo_prueba || 'false' }}
        run: python monitor.py
